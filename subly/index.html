/* Mobilapp i én kolonne, tilpasset Sublys pitch: lys lavendel, hvide kort, lilla totalkort, grønt sparekort */
:root{--bg:#f4f1fa;--card:#fff;--ink:#1f1733;--muted:#857d9c;--line:#ece7f6;--accent:#6d45d6;--accent2:#5a35c0;--soft:#f1ecfd;--mint:#e3f6ea;--mintink:#1c7a4a;--dark:#241a39;--danger:#b3261e;--display:'Manrope',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;--r:22px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b9a5f2;outline-offset:2px}
.shell{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding:0 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media(min-width:560px){body{background:radial-gradient(900px 500px at 80% -10%,#e7ddfb,transparent 60%),var(--bg)}.shell{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg)}}
.logo{font:800 26px var(--display);letter-spacing:-.8px}.logo i{font-style:normal;color:var(--accent)}
h1,h2{font-family:var(--display);letter-spacing:-.6px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px;padding-top:max(18px,env(safe-area-inset-top,0px))}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--soft)}
#app{padding-bottom:calc(110px + var(--safe-b))}body.noTabs #app{padding-bottom:0}
.view{animation:in .28s ease both}@keyframes in{from{opacity:.01;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.view,.sheet,.toast{animation:none!important;transition:none!important}}
.title{font-size:28px;margin:10px 0 16px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 10px 30px -18px rgba(60,30,120,.25)}
.total{background:var(--accent);color:#fff;border-radius:var(--r);padding:22px 22px 20px;box-shadow:0 18px 40px -20px rgba(109,69,214,.7)}
.total .big{font:800 44px/1 var(--display);letter-spacing:-1.5px}.total .big small{font:500 17px var(--body);letter-spacing:0;opacity:.9;margin-left:6px}
.total .sub{opacity:.88;margin-top:10px;font-size:15px}
.label{color:var(--muted);font-size:14px;margin:22px 2px 6px}
.list .row{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .row:last-child{border-bottom:0}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:800 17px var(--display);flex-shrink:0}
.tile.sm{width:38px;height:38px;border-radius:11px;font-size:15px}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.row .amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.pill.soon{background:#fff1e6;color:#b4541a}.pill.off{background:var(--mint);color:var(--mintink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:16px;font-weight:700;font-size:16px}
.btn:active{background:var(--accent2)}.btn[disabled]{opacity:.5}
.btn.ghost{background:var(--soft);color:var(--accent)}.btn.danger{background:#fdecea;color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 7px;font-weight:600;font-size:14px}
.chip .tile{width:26px;height:26px;border-radius:8px;font-size:12px}
.chip.q{padding:9px 14px;color:var(--accent);background:var(--soft);border-color:transparent;text-align:left}
.empty{text-align:center;padding:26px 18px}

.empty h2{font-size:21px}.empty p{color:var(--muted);margin:6px 0 18px}
.steps{display:grid;gap:10px;margin-top:14px}
.step{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}.step b{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0}
/* Tilføj */
.field{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 16px;font-size:17px;outline:0}
.field:focus{border-color:var(--accent)}
.sugg{margin-top:8px}
.sugg .row{padding:11px 4px}
.plans{display:grid;gap:10px}
.plan{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;font-size:17px;width:100%;text-align:left}
.plan span:last-child{font-variant-numeric:tabular-nums}
.plan.on{border-color:var(--accent);background:var(--soft);font-weight:700}
.picked{display:flex;align-items:center;gap:14px;margin-bottom:6px}.picked b{font:800 22px var(--display)}.picked button{margin-left:auto;color:var(--accent);font-weight:650;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ebe5f7;border-radius:14px;padding:4px}.seg button{padding:10px;border-radius:11px;font-weight:650;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,20,80,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{color:var(--accent);font-weight:650;font-size:15px;padding:8px 0}
.ai-load{display:flex;align-items:center;gap:10px;color:var(--muted);padding:14px 4px}
.spin{width:18px;height:18px;border:2.5px solid #d8cdf6;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}.note{font-size:13px;color:var(--muted);margin:8px 2px 0}
/* AI */
.chat{display:flex;flex-direction:column;gap:12px;min-height:40vh}
.bub{max-width:84%;border-radius:20px;padding:12px 16px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}.bub.ai em{display:block;font-style:normal;font-weight:750;color:var(--accent);font-size:13px;margin-bottom:3px}
.bub.err{background:#fdecea;color:var(--danger)}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:4px;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{50%{opacity:.25}}
.askbar{position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:5;pointer-events:none}

.askbar button{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
/* Spar */
.save{background:var(--mint);border-radius:var(--r);padding:22px}.save .big{font:800 44px/1 var(--display);letter-spacing:-1.5px;color:var(--mintink)}.save .sub{color:#2f6b4a;margin-top:8px}

.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
.tabs .plus span.ic{width:46px;height:46px;margin-top:-20px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(109,69,214,.9)}
/* Ark og toast */
.scrim{position:fixed;inset:0;background:rgba(31,23,51,.35);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#ddd5ee;margin:0 auto 14px}
.sheet .stack{display:grid;gap:12px;margin-top:14px}
.lbl{display:block;font-size:14px;color:var(--muted);margin:0 2px 6px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;transition:.25s;z-index:30;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.land .tag{font:700 25px/1.2 var(--display);letter-spacing:-.6px;margin-top:16px}.land .tag span{color:var(--accent)}
.land ul{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:14px}
.land li{display:flex;align-items:center;gap:14px;font-weight:600;font-size:17px}
.land li span{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--accent);box-shadow:0 8px 20px -14px rgba(60,30,120,.4);flex-shrink:0}
.land li span svg{width:22px;height:22px}
.land .go{margin-top:auto;padding-top:36px}
.land .btn{padding:18px;font-size:17px;border-radius:18px}
.land .by{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}

const catalog=SERVICES;
const categories=['Streaming','Musik','Software','Gaming','Sundhed','Mobil og internet','Forsikring og økonomi','Nyheder','Andet'];
const PALETTE=[['#1f2a44','#fff'],['#6d45d6','#fff'],['#0f766e','#fff'],['#b4235a','#fff'],['#1d4ed8','#fff'],['#c2410c','#fff'],['#374151','#fff'],['#7c2d12','#fff'],['#15803d','#fff'],['#9333ea','#fff']];
function initials(n){let w=String(n||'?').replace(/[^\p{L}\p{N}+& ]/gu,' ').trim().split(/\s+/);return (w.length>1&&w[1][0]&&/\p{Lu}/u.test(w[1][0])?w[0][0]+w[1][0]:String(n||'?').slice(0,1)).toUpperCase()}
function paletteFor(n){let h=0;for(let c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
for(const [n,c,dom,u,sc,al] of EXTRA_SERVICES){if(SERVICES.some(x=>x.name===n))continue;let [bg,fg]=paletteFor(n);SERVICES.push({name:n,category:categories[c]||'Andet',sub:SUBCATS[sc]||'',domain:dom,url:u||'https://'+dom,color:bg,fg,logo:initials(n),aliases:al||[]})}
// ---------- Hjælpere ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr=n=>Math.round(n).toLocaleString('da-DK')+' kr.';
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9æøå+ ]/g,'').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{let [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{let d=new Date();d.setHours(0,0,0,0);return d};
function addMonths(d,n){let x=new Date(d.getFullYear(),d.getMonth()+n,1);x.setDate(Math.min(d.getDate(),new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x}
function nextPay(s){let a=parse(s.next),t=today(),step=s.cycle==='yearly'?12:1,n=0;let d=a;while(d<t&&n<600){n+=step;d=addMonths(a,n)}return d}
const daysTo=d=>Math.round((d-today())/864e5);
const when=d=>{let n=daysTo(d);return n===0?'I dag':n===1?'I morgen':n<8?'Om '+n+' dage':d.toLocaleDateString('da-DK',{day:'numeric',month:'short'})};
const perMonth=s=>s.cycle==='yearly'?s.price/12:s.price;
function lum(hex){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');let [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);return .299*r+.587*g+.114*b}
function look(name){let x=findService(name);let bg=x?.color||paletteFor(name)[0];if(!/^#[0-9a-f]{3,6}$/i.test(bg)||lum(bg)>.85)bg=paletteFor(name)[0];return {bg,fg:lum(bg)>.62?'#1f1733':'#fff',t:initials(x?.name||name)}}
const tile=(name,cls='')=>{let l=look(name);return `<span class="tile ${cls}" style="background:${l.bg};color:${l.fg}" aria-hidden="true">${esc(l.t)}</span>`};
function findService(name){let n=norm(name);if(!n)return null;return SERVICES.find(x=>norm(x.name)===n||(x.aliases||[]).some(a=>norm(a)===n))||null}
function matches(q){let n=norm(q);if(!n)return [];return SERVICES.map(x=>{let names=[x.name,...(x.aliases||[])].map(norm);return [names.some(v=>v.startsWith(n))?2:names.some(v=>v.includes(n))?1:0,x]}).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name)).slice(0,6).map(a=>a[1])}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}

function topbar(title){return `<div class="top"><button class="logo" onclick="go('start')" aria-label="Til forsiden">subly<i>.</i></button>${db.subs.length?`<button class="iconbtn" onclick="menu()" aria-label="Indstillinger"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`:''}</div>${title?`<h1 class="title">${title}</h1>`:''}`}

function overview(){let subs=[...db.subs].sort((a,b)=>nextPay(a)-nextPay(b));
if(!subs.length)return `<div class="view">${topbar('')}<div class="total"><div class="big">0 kr.<small>/ måned</small></div><div class="sub">Tilføj dit første abonnement</div></div><div class="card empty" style="margin-top:16px"><div class="em">＋</div><h2>Hvad betaler du for?</h2><p>Tryk på en tjeneste for at starte</p>${quick()}<div style="margin-top:16px"><button class="link" onclick="go('tilfoj')">Søg efter en anden →</button></div></div><div class="card" style="margin-top:14px"><div class="steps"><div class="step"><b>1</b>Tilføj dine abonnementer</div><div class="step"><b>2</b>Spørg AI-assistenten</div><div class="step"><b>3</b>Se hvad du kan spare</div></div></div></div>`;

function openSub(id){let s=db.subs.find(x=>x.id===id);if(!s)return;let x=findService(s.name);sheet(`<div class="picked">${tile(s.name)}<b>${esc(s.name)}</b></div><div class="note" style="margin:0 2px">${esc(s.plan||'Egen pris')} · næste betaling ${esc(nextPay(s).toLocaleDateString('da-DK',{day:'numeric',month:'long'}))}</div><form class="stack" onsubmit="event.preventDefault();saveSub('${s.id}',this)"><div class="two"><label><span class="lbl">Pris (kr.)</span><input class="field" name="price" type="number" inputmode="decimal" min="0" max="100000" step="0.01" required value="${s.price}"></label><label><span class="lbl">Næste betaling</span><input class="field" name="next" type="date" required value="${iso(nextPay(s))}"></label></div><div class="seg" role="radiogroup"><button type="button" class="${s.cycle!=='yearly'?'on':''}" onclick="segPick(this,'monthly')">Om måneden</button><button type="button" class="${s.cycle==='yearly'?'on':''}" onclick="segPick(this,'yearly')">Om året</button></div><input type="hidden" name="cycle" value="${s.cycle}"><button class="btn">Gem</button>${x?.url?`<a class="btn ghost" style="text-decoration:none" href="${esc(x.url)}" target="_blank" rel="noopener">Gå til ${esc(s.name)} ↗</a>`:''}<button type="button" class="btn danger" onclick="delSub('${s.id}')">Slet</button></form>`)}
function segPick(b,v){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));b.closest('form').cycle.value=v}
function saveSub(id,f){let s=db.subs.find(x=>x.id===id);let p=Number(f.price.value);if(!(p>=0))return;s.price=p;s.next=f.next.value||s.next;s.cycle=f.cycle.value;save();closeSheet();render();toast('Gemt')}
function delSub(id){db.subs=db.subs.filter(x=>x.id!==id);save();closeSheet();render();toast('Slettet')}
function menu(){sheet(`<h2 style="font-size:22px">Indstillinger</h2><div class="stack"><button class="btn ghost" onclick="closeSheet();go('start')">Til forsiden</button><button class="btn danger" onclick="clearAll(this)">Ryd alle abonnementer</button><p class="note">Dine abonnementer gemmes kun på denne telefon.</p></div>`)}
function clearAll(b){if(b.dataset.ok){db={subs:[]};save();closeSheet();go('oversigt');toast('Alt er ryddet');return}b.dataset.ok=1;b.textContent='Tryk igen for at rydde alt'}

if(d.loading)planHtml=`<div class="ai-load"><span class="spin"></span>Finder planer og priser…</div>`;
else if(d.plans&&d.plans.length&&!d.manual)planHtml=`<div class="label" style="margin-top:18px">Vælg din plan${d.ai?' <span class="pill off" style="margin-left:4px">Fundet med AI</span>':''}</div><div class="plans">${d.plans.map((p,i)=>`<button type="button" class="plan ${d.plan===i?'on':''}" onclick="pickPlan(${i})"><span>${esc(p[0])}</span><span>${p[1]==null?'Ukendt':kr(p[1])}${p[2]==='yearly'?' / år':''}</span></button>`).join('')}</div><button class="link" onclick="manual()">Skriv selv prisen</button>`;
else planHtml=`${d.err?`<p class="note">${esc(d.err)}</p>`:''}${!d.triedAi&&!d.manual?`<button class="btn ghost" style="margin-top:16px" onclick="lookup()">✦ Find planer med AI</button><div class="center"><button class="link" onclick="manual()">Skriv selv prisen</button></div>`:`<div class="label" style="margin-top:18px">Pris</div><div class="two"><input class="field" id="mprice" type="number" inputmode="decimal" min="0" max="100000" step="0.01" placeholder="0" value="${d.price??''}" oninput="draft.price=this.value===''?null:Number(this.value);upd()"><div class="seg" style="align-content:center"><button type="button" class="${d.cycle!=='yearly'?'on':''}" onclick="draft.cycle='monthly';render()">/ md.</button><button type="button" class="${d.cycle==='yearly'?'on':''}" onclick="draft.cycle='yearly';render()">/ år</button></div></div>`}`;
let ready=d.price!=null&&d.price>=0&&!d.loading;
return `<div class="view">${topbar('Tilføj abonnement')}<div class="picked">${tile(d.name)}<b>${esc(d.name)}</b><button onclick="draft=null;render()">Skift</button></div>${planHtml}<div class="label">Næste betaling</div><input class="field" type="date" value="${d.next}" onchange="draft.next=this.value"><div style="margin-top:22px"><button class="btn" id="addbtn" ${ready?'':'disabled'} onclick="addSub()">Tilføj</button></div></div>`}
function afterAdd(){let q=$('#q');if(q&&matchMedia('(hover:hover)').matches)q.focus()}
function suggest(v){let box=$('#sugg');let list=matches(v);let exact=findService(v);if(!v.trim()){box.hidden=true;return}box.hidden=false;box.innerHTML=list.map(x=>`<button class="row" onclick="pick('${esc(x.name).replace(/'/g,'&#39;')}')">${tile(x.name,'sm')}<span class="nm"><b>${esc(x.name)}</b><small>${x.plans?x.plans.length+' planer':esc(x.sub||x.category||'')}</small></span></button>`).join('')+(exact?'':`<button class="row" data-custom="1">${tile(v,'sm')}<span class="nm"><b>Tilføj “${esc(v.trim())}”</b><small>Ikke på listen</small></span></button>`);let c=box.querySelector('[data-custom]');if(c)c.onclick=()=>pick(v.trim())}
function pick(name){name=String(name).slice(0,60);let x=findService(name);let n=x?.name||name;let cached=aiPlans[norm(n)];draft={name:n,plans:x?.plans||cached?.plans||null,ai:!x?.plans&&!!cached,plan:null,price:null,cycle:'monthly',next:iso(addMonths(today(),1)),triedAi:false};if(draft.plans&&draft.plans.length===1)pickPlan(0,true);render();if(!draft.plans)lookup()}
function pickPlan(i,quiet){let p=draft.plans[i];draft.plan=i;draft.price=p[1];draft.cycle=p[2]==='yearly'?'yearly':'monthly';if(p[1]==null){draft.manual=true}if(!quiet)render()}
function manual(){draft.manual=true;draft.triedAi=true;render();setTimeout(()=>$('#mprice')?.focus(),50)}
function upd(){let b=$('#addbtn');if(b)b.disabled=!(draft.price!=null&&draft.price>=0)}
async function lookup(){let d=draft;d.loading=true;d.triedAi=true;render();try{let r=await fetch('/api/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:d.name})});let j=await r.json();if(draft!==d)return;let plans=(j.found&&Array.isArray(j.plans)?j.plans:[]).filter(p=>p&&p.name).slice(0,8).map(p=>[String(p.name).slice(0,40),Number.isFinite(p.price)?p.price:null,p.cycle==='yearly'?'yearly':'monthly']);if(plans.length){d.plans=plans;d.ai=true;aiPlans[norm(d.name)]={plans};try{localStorage.setItem('subly-ai-plans',JSON.stringify(aiPlans))}catch{}}else d.err=r.ok?'Vi fandt ingen planer. Skriv prisen selv.':'AI-søgningen virker ikke lige nu. Skriv prisen selv.'}catch{if(draft===d)d.err='Ingen forbindelse. Skriv prisen selv.'}d.loading=false;if(draft===d)render()}
function addSub(){let d=draft;if(!d||d.price==null)return;let p=d.plan!=null&&d.plans?d.plans[d.plan][0]:'';db.subs.push({id:uid(),name:d.name,plan:p,price:Number(d.price),cycle:d.cycle,next:d.next||iso(addMonths(today(),1)),unused:false});save();draft=null;toast(d.name+' er tilføjet');go('oversigt')}

// ---------- AI ----------
let chat=[],busy=false;
function aiData(){return {dato_i_dag:iso(today()),i_alt_pr_maaned:Math.round(total()*100)/100,i_alt_pr_aar:Math.round(total()*12),abonnementer:db.subs.map(s=>({navn:s.name,plan:s.plan||null,pris:s.price,periode:s.cycle==='yearly'?'årligt':'månedligt',pr_maaned:Math.round(perMonth(s)*100)/100,naeste_betaling:iso(nextPay(s)),bruges_sjaeldent:!!s.unused}))}}
function aiQs(){let q=['Hvad betaler jeg om året?','Hvad kan jeg spare?'];let u=db.subs.find(s=>s.unused)||[...db.subs].sort((a,b)=>perMonth(b)-perMonth(a))[0];if(u)q.push('Hvordan opsiger jeg '+u.name+'?');else q.push('Hvordan opsiger jeg Netflix?');return q}
function aiView(){return `<div class="view">${topbar('AI-assistent')}<div class="chat" id="chat">${!chat.length?`<div class="bub ai"><em>Subly AI</em>${db.subs.length?'Spørg mig om dine abonnementer.':'Tilføj dine abonnementer først, så kan jeg regne på dem.'}</div><div class="chips" style="margin-top:2px">${aiQs().map(q=>`<button class="chip q" onclick="ask(this.textContent)">${esc(q)}</button>`).join('')}</div>`:''}${chat.map(m=>m.role==='user'?`<div class="bub me">${esc(m.content)}</div>`:`<div class="bub ai ${m.err?'err':''}"><em>Subly AI</em>${m.pending?'<span class="dots"><i></i><i></i><i></i></span>':esc(m.content)}</div>`).join('')}</div></div><div class="askbar"><form onsubmit="event.preventDefault();let i=this.q;let v=i.value.trim();if(v){i.value='';ask(v)}"><input name="q" id="askin" maxlength="500" placeholder="Skriv et spørgsmål…" autocomplete="off" enterkeyhint="send"><button aria-label="Send" ${busy?'disabled':''}><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3 10l12 2-12 2z"/></svg></button></form></div>`}
function afterAi(){let c=$('#chat');if(c)c.lastElementChild?.scrollIntoView({block:'end'});window.scrollTo(0,document.body.scrollHeight)}
async function ask(q){if(busy)return;chat.push({role:'user',content:q});let r={role:'assistant',content:'',pending:true};chat.push(r);busy=true;let keep=$('#askin')?.value||'';render();$('#askin')&&($('#askin').value=keep);
try{let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.filter(m=>!m.pending&&!m.err).map(m=>({role:m.role,content:m.content})),data:aiData()})});let j=await res.json().catch(()=>({}));if(res.ok&&j.text)r.content=j.text;else{r.err=true;r.content=j.error==='rate_limited'?'For mange spørgsmål på kort tid. Vent et øjeblik.':j.error==='quota_reached'?'AI-assistenten er sat på pause lige nu.':'AI-assistenten svarer ikke lige nu. Prøv igen.'}}catch{r.err=true;r.content='Ingen forbindelse. Prøv igen.'}
r.pending=false;busy=false;if(view==='ai'){let k=$('#askin')?.value||'';render();if($('#askin'))$('#askin').value=k}}

// ---------- Spar ----------
function saveView(){if(!db.subs.length)return `<div class="view">${topbar('Spar penge')}<div class="save"><div class="big">0 kr.</div><div class="sub">kan du spare om året</div></div><div class="card empty" style="margin-top:16px"><div class="em">✓</div><h2>Ingen abonnementer endnu</h2><p>Tilføj dem, du betaler for</p><button class="btn" onclick="go('tilfoj')">Tilføj abonnement</button></div></div>`;
let sv=db.subs.filter(s=>s.unused).reduce((a,s)=>a+perMonth(s)*12,0);
return `<div class="view">${topbar('Spar penge')}<div class="save"><div class="big">${kr(sv)}</div><div class="sub">${sv?'kan du spare om året':'Markér det, du ikke bruger'}</div></div><div class="label">Bruger du stadig disse?</div><div class="card list" style="padding:4px 18px">${[...db.subs].sort((a,b)=>perMonth(b)-perMonth(a)).map(s=>`<button class="row" role="checkbox" aria-checked="${!!s.unused}" onclick="toggleUnused('${s.id}')">${tile(s.name)}<span class="nm"><b>${esc(s.name)}</b><small>${kr(perMonth(s)*12)} om året</small></span><span class="check ${s.unused?'on':''}">${s.unused?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':''}</span></button>`).join('')}</div>${sv?`<button class="btn ghost" style="margin-top:16px" onclick="go('ai');ask('Hvordan opsiger jeg '+db.subs.filter(s=>s.unused).map(s=>s.name).join(' og ')+'?')">✦ Hjælp mig med at opsige</button>`:''}</div>`}
function toggleUnused(id){let s=db.subs.find(x=>x.id===id);s.unused=!s.unused;save();render()}

// ---------- Ark ----------
function sheet(html){let s=$('#sheet'),c=$('#scrim');s.innerHTML='<div class="grab"></div>'+html;s.hidden=false;c.hidden=false;requestAnimationFrame(()=>{s.classList.add('show');c.classList.add('show')})}
function closeSheet(){let s=$('#sheet'),c=$('#scrim');s.classList.remove('show');c.classList.remove('show');setTimeout(()=>{s.hidden=true;c.hidden=true},250)}
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

// ---------- Start ----------
{let h=location.hash.slice(1);if(['oversigt','tilfoj','ai','spar'].includes(h))view=h}
render();
</script>
</body>
</html>
