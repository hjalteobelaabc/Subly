async function sendChat(q){if(chatBusy)return;if(view!=='assistent'){go('assistent')}chatTurns.push({role:'user',content:q});let reply={role:'assistant',content:'',pending:true};chatTurns.push(reply);chatBusy=true;let draft=$('#chatIn')?.value||'';render();if($('#chatIn'))$('#chatIn').value=draft;let history=chatTurns.filter(t=>!t.err&&!t.pending).slice(-10).map(t=>({role:t.role,content:t.content}));while(history.length&&history[0].role!=='user')history.shift();try{let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,data:chatData()})});let j=await res.json().catch(()=>null);if(!res.ok)throw {code:j&&j.error};reply.content=String(j.text||'').replace(/\*\*/g,'').trim()||'Jeg fik ikke noget svar. Prøv igen.'}catch(e){reply.err=true;reply.content=({quota_reached:'AI er sat på pause, fordi månedens AI-budget er brugt.',rate_limited:'Der er sendt mange spørgsmål. Prøv igen om lidt.',not_configured:'AI er ikke sat op. API-nøglen mangler på serveren.'})[e&&e.code]||'AI kunne ikke svare lige nu. Tjek forbindelsen og prøv igen.'}reply.pending=false;chatBusy=false;if(view==='assistent'){let d=$('#chatIn')?.value||'';render();if($('#chatIn'))$('#chatIn').value=d}}

async function gmailRequest(path,signal,tries=0){let res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path,{headers:{Authorization:'Bearer '+gmailToken},cache:'no-store',signal});if(!res.ok){if((res.status===429||res.status>=500)&&tries<4){await new Promise(r=>setTimeout(r,800*2**tries));return gmailRequest(path,signal,tries+1)}if(res.status===401){gmailToken=null;throw Error('Google-adgangen er udløbet. Forbind din konto igen.')}if(res.status===403)throw Error('Google afviste adgangen. Kontrollér Gmail API, testbrugere og samtykke i Google-projektet.');if(res.status===429)throw Error('Google modtager for mange forespørgsler. Vent lidt, og prøv igen.');throw Error('Gmail kunne ikke læses. Prøv igen senere.')}return res.json()}

function parseGmailMessage(m){let headers=m.payload?.headers||[],get=n=>headers.find(h=>h.name.toLowerCase()===n)?.value||'';let from=get('from'),subject=get('subject'),snippet=decodeSnippet(m.snippet||''),text=(from+' '+subject+' '+snippet).toLowerCase();let display=from.replace(/<[^>]*>/g,'').replace(/["<>]/g,'').trim(),dom=senderDomain(from);let known=serviceByDomain(dom,text)||serviceByName(display);let subWords=/abonnement|subscription|forny|renew|recurring|prøveperiode|free trial|medlemskab|membership/.test(text);let payWords=/kvittering|receipt|faktura|invoice|betaling|payment|trukket|charged|billing|ordre|order|\bkr\b|kr\.|dkk|pris|price/.test(text);if(!subWords&&!(known&&payWords))return null;let name=known?.name||display||from.split('@')[0]||'Ukendt abonnement';let price=parsePrice(snippet);let timestamp=Number(m.internalDate)||0;return {name:name.slice(0,60),domain:known?.domain||dom.replace(/^(mail|email|e|info|news|noreply|no-reply|account|accounts|billing)\./,''),subject,from,snippet,price,cycle:/annual|yearly|årlig|pr\. år/.test(text)?'yearly':/monthly|måned|per month/.test(text)?'monthly':'',category:known?.category||'Andet',timestamp,received:timestamp?new Date(timestamp).toLocaleDateString('da-DK'):''}}
function parsePrice(text){let all=[...String(text).matchAll(/(?:DKK|kr\.?)\s*(\d[\d.,]*\d|\d)|(\d[\d.,]*\d|\d)\s*(?:DKK|kr\b|kr\.)/gi)];if(!all.length)return null;let m=all.find(x=>/[.,]\d{2}$/.test(x[1]||x[2]))||all[0];let raw=(m[1]||m[2]).replace(/[.,]$/,'');let lastDot=raw.lastIndexOf('.'),lastComma=raw.lastIndexOf(',');if(lastDot>-1&&lastComma>-1){if(lastComma>lastDot)raw=raw.replace(/\./g,'').replace(',','.');else raw=raw.replace(/,/g,'')}else if(lastComma>-1){raw=/,\d{1,2}$/.test(raw)?raw.replace(',','.'):raw.replace(/,/g,'')}else if(/^\d{1,3}(\.\d{3})+$/.test(raw))raw=raw.replace(/\./g,'');let n=Number(raw);return Number.isFinite(n)&&n>0&&n<=100000?n:null}

function calendar(){let ev=monthEvents(),offset=(cal.getDay()+6)%7,count=new Date(cal.getFullYear(),cal.getMonth()+1,0).getDate();return `<div class="panel"><div class="calhead"><button onclick="moveMonth(-1)" aria-label="Forrige måned">←</button><h2>${cal.toLocaleDateString('da-DK',{month:'long',year:'numeric'})}</h2><button onclick="moveMonth(1)" aria-label="Næste måned">→</button></div><div class="calendar">${['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map(d=>`<div class="dayname">${d}</div>`).join('')}${'<div class="day blank"></div>'.repeat(offset)}${Array.from({length:count},(_,i)=>{let d=new Date(cal.getFullYear(),cal.getMonth(),i+1);return `<div class="day ${iso(d)===iso(now)?'today':''}">${i+1}${ev.filter(e=>e.d.getDate()===i+1).map(({s})=>`<button class="event" style="background:${s.color};color:${s.fg}" onclick="edit('${s.id}')">${esc(s.name)}<br>${money(s.price)}</button>`).join('')}</div>`}).join('')}</div><p class="help">${ev.length} betalinger denne måned · I alt ${money(ev.reduce((a,e)=>a+e.s.price,0))}. Vælg en betaling for at redigere.</p><button class="secondary" onclick="exportCalendar()">↓ Hent kalender med påmindelser (.ics)</button></div>`}

function analytics(){let colors=['#586be8','#28ba7e','#f0af68','#ad83d9','#83b6cb','#e07a8f','#5fb3a5','#c49a3a','#9aa0b5'];let cats=categories.map((c,i)=>({name:c,value:active().filter(s=>s.category===c).reduce((a,s)=>a+monthly(s),0),color:colors[i]})).filter(c=>c.value);let acc=0;let grad=cats.map(c=>{let start=acc;acc+=c.value/(total()||1)*100;return `${c.color} ${start}% ${acc}%`}).join(',');return `<div class="analysis-grid"><div class="panel"><h2>Udgifter efter kategori</h2><div class="donut" style="background:conic-gradient(${grad||'#eceef6 0% 100%'})"><div class="donutinner">${money(total())}<small>pr. måned</small></div></div>${cats.map(c=>`<div class="legend"><i style="background:${c.color}"></i>${c.name}<strong>${money(c.value)}</strong></div>`).join('')}</div><div class="panel"><h2>Dine største udgifter</h2>${active().sort((a,b)=>monthly(b)-monthly(a)).slice(0,6).map(s=>`<div class="legend">${esc(s.name)}<strong>${money(monthly(s))}</strong></div><div class="bar"><span style="width:${monthly(s)/(total()||1)*100}%"></span></div>`).join('')}<p class="help">Alle beløb er omregnet til månedlige udgifter. Årlige betalinger fordeles over 12 måneder.</p></div><div class="panel"><div class="sectionhead"><h2>Dit månedlige budget</h2><button class="all-link" onclick="settings()">Rediger ↗</button></div><div class="statvalue">${money(total())}<small>af ${money(db.budget)}</small></div><div class="bar"><span style="width:${Math.min(100,total()/db.budget*100)}%;background:${total()>db.budget?'#df7b79':'#586be8'}"></span></div><p class="help">${total()>db.budget?money(total()-db.budget)+' over dit budget':money(db.budget-total())+' tilbage i dit budget'}</p></div></div>`}
function savings(){let unused=active().filter(s=>s.unused),save=unused.reduce((a,s)=>a+monthly(s),0);return `<div class="analysis-grid"><div class="panel"><h2>Bruger du stadig disse?</h2><p class="help">Markér de abonnementer, du sjældent bruger, for at beregne en mulig besparelse.</p>${active().map(s=>`<div class="savingrow">${logo(s,true)}<div><strong>${esc(s.name)}</strong><small>${money(monthly(s))} pr. måned</small></div><label class="checklabel" style="margin:0"><input type="checkbox" ${s.unused?'checked':''} onchange="toggleUnused('${s.id}',this.checked)">Bruges sjældent</label></div>`).join('')||'<p class="help">Tilføj abonnementer for at komme i gang.</p>'}</div><div><div class="tip"><div class="bulb">✧</div><h2>Din mulige besparelse</h2><div class="save-total">${money(save*12)}</div><p>om året ved at opsige ${unused.length} markerede abonnementer.<br>Det svarer til ${money(save)} om måneden.</p></div><div class="panel" style="margin-top:20px"><h2>Sådan kommer du videre</h2><p class="help">1. Åbn tjenestens hjemmeside eller den appbutik, du betaler gennem.<br><br>2. Find abonnementet under din konto eller dine betalinger.<br><br>3. Følg tjenestens opsigelsesproces og gem bekræftelsen.<br><br>4. Markér abonnementet som inaktivt her i Subly.</p><p class="help">Subly opsiger ikke abonnementer hos udbyderen.</p></div></div></div>`}
function toggleUnused(id,val){db.subs.find(s=>s.id===id).unused=val;persist();render()}
function modal(html){$('#modalcontent').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function head(title){return `<div class="modalhead"><h2>${title}</h2><button class="close" aria-label="Luk" onclick="closeModal()">×</button></div>`}
function edit(id){editing=id||null;let s=db.subs.find(s=>s.id===id)||{name:'',plan:'',price:'',category:'Andet',cycle:'monthly',next:plus(1),remind:3,color:'#7953d9',active:true};picked=null;modal(head(id?'Rediger abonnement':'Tilføj abonnement')+`<form id="subform" onsubmit="saveSub(event)" autocomplete="off"><label>Tjeneste<div class="combo"><input name="name" required maxlength="60" placeholder="Søg fx Netflix, Spotify eller TV 2 Play" value="${esc(s.name)}" oninput="suggest(this.value)" onfocus="suggest(this.value)" onkeydown="comboKey(event)" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"><div class="suggest" id="suggest" role="listbox" hidden></div></div></label><div id="plans"></div><label>Abonnementstype<input name="plan" maxlength="60" placeholder="Fx Premium Individual" value="${esc(s.plan)}"></label><div class="formrow"><label>Pris i DKK<input name="price" type="number" min="0" max="1000000" step="0.01" required value="${s.price}"></label><label>Betalingsperiode<select name="cycle">${[['monthly','Månedligt'],['quarterly','Kvartalsvis'],['yearly','Årligt']].map(([v,l])=>`<option value="${v}" ${s.cycle===v?'selected':''}>${l}</option>`).join('')}</select></label></div><div class="formrow"><label>Næste betaling<input name="next" type="date" required value="${s.next}"></label><label>Kategori<select name="category">${categories.map(c=>`<option ${s.category===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="formrow"><label>Påmindelse<select name="remind">${[0,1,3,7].map(n=>`<option value="${n}" ${+s.remind===n?'selected':''}>${n===0?'På dagen':n+(n===1?' dag før':' dage før')}</option>`).join('')}</select></label><label>Kortfarve<input name="color" type="color" value="${/^#[0-9a-f]{6}$/i.test(s.color)?s.color:'#ffffff'}" style="height:41px;padding:4px"></label></div><p class="help">Påmindelser vises i appen. Hent kalenderfilen under Kalender for varsler i din egen kalender.</p>${id?`<label class="checklabel"><input name="active" type="checkbox" ${s.active?'checked':''}>Aktivt abonnement</label>`:''}<div class="formactions">${id?`<button type="button" class="danger" onclick="removeSub('${id}')">Slet abonnement</button>`:'<button type="button" class="secondary" onclick="closeModal()">Annuller</button>'}<button class="primary" type="submit">${id?'Gem ændringer':'Tilføj abonnement'}</button></div></form>`);if(!id)setTimeout(()=>$('#subform')?.elements.name.focus(),60);else{let known=findService(s.name);if(known?.plans)showPlans(known,'local',s.plan)}}
let picked=null,aiPlans={},suggestIdx=-1;
try{aiPlans=JSON.parse(localStorage.getItem('subly-ai-plans')||'{}')||{}}catch{aiPlans={}}
const norm=t=>String(t||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9æøå+ ]/g,'').trim();
function findService(name){let n=norm(name);return SERVICES.find(x=>norm(x.name)===n||(x.aliases||[]).some(a=>norm(a)===n))||null}
function matches(q){let n=norm(q);if(!n)return SERVICES.slice(0,8);let scored=SERVICES.map(x=>{let names=[x.name,...(x.aliases||[])].map(norm);let sc=names.some(v=>v.startsWith(n))?2:names.some(v=>v.includes(n))?1:0;return [sc,x]}).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name));return scored.slice(0,7).map(a=>a[1])}
function suggest(q){let box=$('#suggest'),inp=$('#subform')?.elements.name;if(!box||!inp)return;let list=matches(q),exact=findService(q);suggestIdx=-1;let items=list.map((x,i)=>`<button type="button" role="option" class="sugg" data-i="${i}" onmousedown="event.preventDefault()" onclick="pickService('${esc(x.name).replace(/'/g,'&#39;')}')">${logo(x,true)}<span><strong>${esc(x.name)}</strong><small>${x.plans?x.plans.length+' planer · priser tjekket '+PRICES_CHECKED:aiPlans[norm(x.name)]?'Planer fundet med AI':'Find planer med AI'}</small></span></button>`).join('');let ai=q.trim().length>=2&&!exact?`<button type="button" role="option" class="sugg ai" onmousedown="event.preventDefault()" onclick="lookupPlans()"><span class="mini-logo" style="background:#241a39;color:#b6f2c8">✦</span><span><strong>Find planer for “${esc(q.trim())}”</strong><small>AI søger efter tjenestens planer og priser</small></span></button>`:'';box.innerHTML=items+ai||'<p class="help" style="padding:10px 12px;margin:0">Skriv navnet på tjenesten.</p>';box.hidden=false;inp.setAttribute('aria-expanded','true');if(exact&&picked!==exact.name)pickService(exact.name,true)}
function comboKey(e){let box=$('#suggest');if(!box||box.hidden)return;let opts=[...box.querySelectorAll('.sugg')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();suggestIdx=(suggestIdx+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts.forEach((o,i)=>o.classList.toggle('on',i===suggestIdx));opts[suggestIdx]?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'&&suggestIdx>-1){e.preventDefault();opts[suggestIdx].click()}else if(e.key==='Escape'){box.hidden=true}}
document.addEventListener('click',e=>{if(!e.target.closest('.combo')){let b=$('#suggest');if(b)b.hidden=true}});
function pickService(name,quiet){let x=findService(name)||SERVICES.find(v=>v.name===name);let f=$('#subform');if(!x||!f)return;if(f.dataset.svc&&f.dataset.svc!==x.name){f.elements.plan.value='';f.elements.price.value=''}f.dataset.svc=x.name;picked=x.name;f.elements.name.value=x.name;f.elements.category.value=x.category;f.elements.color.value=/^#[0-9a-f]{6}$/i.test(x.color)?x.color:'#ffffff';if(!quiet){$('#suggest').hidden=true;f.elements.name.setAttribute('aria-expanded','false')}let cached=aiPlans[norm(x.name)];if(x.plans)showPlans(x,'local');else if(cached)showPlans({name:x.name,plans:cached.plans,url:cached.url,verified:cached.verified},'ai');else $('#plans').innerHTML=`<div class="planbox"><p class="help" style="margin:0">Vi har ikke planerne for ${esc(x.name)} gemt endnu.</p><button type="button" class="secondary" onclick="lookupPlans()">✦ Find planer med AI</button></div>`}
function showPlans(x,src,current){let box=$('#plans');if(!box)return;if(!x.plans||!x.plans.length){box.innerHTML=`<div class="planbox"><p class="help" style="margin:0">Vi kunne ikke finde planer for ${esc(x.name)}. Skriv selv abonnementstype og pris nedenfor.</p></div>`;return}box.innerHTML=`<div class="planbox"><div class="planhead"><strong>Vælg din plan</strong><span>${src==='ai'?(x.verified===false?'AI-forslag uden websøgning · tjek prisen':'Fundet med AI-websøgning · tjek prisen'):'Tjekket '+PRICES_CHECKED}</span></div><div class="planchips">${x.plans.map((p,i)=>`<button type="button" class="planchip ${current===p[0]?'on':''}" onclick="usePlan(${i})"><b>${esc(p[0])}</b><span>${p[1]==null?'Pris ukendt':money(p[1])+(p[2]==='yearly'?' / år':p[2]==='quarterly'?' / kvartal':' / md.')}</span></button>`).join('')}</div>${x.url?`<a class="textlink" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" style="font-size:12px">Se priser hos ${esc(x.name)} ↗</a>`:''}<p class="help" style="margin:6px 0 0">Findes din plan ikke? Skriv den selv nedenfor.</p></div>`;box._plans=x.plans}
function usePlan(i){let p=$('#plans')._plans?.[i],f=$('#subform');if(!p||!f)return;f.elements.plan.value=p[0];if(p[1]!=null)f.elements.price.value=p[1];f.elements.cycle.value=p[2]||'monthly';document.querySelectorAll('.planchip').forEach((c,j)=>c.classList.toggle('on',j===i));if(p[1]==null)f.elements.price.focus()}
async function lookupPlans(){let f=$('#subform');if(!f)return;let q=f.elements.name.value.trim();if(q.length<2){f.elements.name.focus();return}$('#suggest').hidden=true;if(f.dataset.svc!==q){f.elements.plan.value='';f.elements.price.value='';f.dataset.svc=q}let box=$('#plans');box.innerHTML=`<div class="planbox"><div class="scan-status" role="status" style="margin:0"><span class="spinner"></span> Søger efter planer for ${esc(q)}…</div></div>`;try{let res=await fetch('/api/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:q})});let j=await res.json().catch(()=>null);if(!res.ok||!j)throw {code:j&&j.error};if(!$('#subform'))return;if(!j.found||!Array.isArray(j.plans)||!j.plans.length){showPlans({name:j.service||q,plans:[]},'ai');return}let plans=j.plans.slice(0,8).map(p=>[String(p.name||'Plan').slice(0,60),typeof p.price==='number'&&p.price>=0&&p.price<100000?p.price:null,['monthly','quarterly','yearly'].includes(p.cycle)?p.cycle:'monthly']);let name=String(j.service||q).slice(0,60);f.elements.name.value=name;if(categories.includes(j.category))f.elements.category.value=j.category;aiPlans[norm(name)]={plans,url:/^https:\/\//.test(j.url||'')?j.url:'',verified:j.verified!==false,at:Date.now()};try{localStorage.setItem('subly-ai-plans',JSON.stringify(aiPlans))}catch{}showPlans({name,plans,url:aiPlans[norm(name)].url,verified:j.verified!==false},'ai')}catch(e){if(!$('#plans'))return;$('#plans').innerHTML=`<div class="planbox"><p class="help" style="margin:0">${e&&e.code==='quota_reached'?'AI er sat på pause, fordi månedens AI-budget er brugt.':'Planerne kunne ikke hentes lige nu.'} Skriv selv abonnementstype og pris nedenfor.</p></div>`}}
function saveSub(e){e.preventDefault();let f=e.target,d=new FormData(f),old=db.subs.find(s=>s.id===editing),name=d.get('name').trim();if(!name){f.elements.name.setCustomValidity('Skriv et navn');f.elements.name.reportValidity();f.elements.name.oninput=()=>f.elements.name.setCustomValidity('');return}let match=findService(name);let color=d.get('color'),rgb=parseInt(color.slice(1),16),luma=(((rgb>>16)&255)*.299+((rgb>>8)&255)*.587+(rgb&255)*.114);let s={...old,id:editing||uid(),name,plan:d.get('plan').trim(),price:Number(d.get('price')),cycle:d.get('cycle'),next:d.get('next'),category:d.get('category'),remind:Number(d.get('remind')),color,fg:luma>155?'#24323a':'#ffffff',logo:match?.logo||name.charAt(0).toUpperCase(),active:editing?d.get('active')==='on':true};if(old)db.subs[db.subs.indexOf(old)]=s;else db.subs.push(s);persist();closeModal();render();toast('Abonnementet er gemt')}
function removeSub(id){let s=db.subs.find(s=>s.id===id);$('#modalcontent').innerHTML=head('Slet '+esc(s.name)+'?')+`<p class="help">Dette fjerner abonnementet fra din oversigt. Det opsiger ikke din aftale hos udbyderen.</p><div class="formactions"><button class="secondary" onclick="closeModal()">Annuller</button><button class="primary" onclick="confirmDelete('${id}')">Slet fra oversigten</button></div>`}
function confirmDelete(id){db.subs=db.subs.filter(s=>s.id!==id);persist();closeModal();render();toast('Abonnementet er fjernet')}
function settings(){modal(head('Indstillinger')+`${cfg.accounts?`<div class="settingrow"><strong>Konto</strong>${me?`<p class="help">Logget ind som ${esc(me.name||me.email||'Subly-bruger')}. Din oversigt gemmes i din konto.</p><button class="secondary" onclick="accountModal()">Administrér konto</button>`:'<p class="help">Log ind for at gemme din oversigt i en konto og bruge den på alle dine enheder.</p><button class="primary" onclick="authModal(\'login\')">Log ind eller opret konto</button>'}</div>`:''}<div class="settingrow"><strong>Gmail-forbindelse</strong><p class="help">Find abonnementer fra kvitteringer og fornyelser i Gmail.</p><button class="secondary" onclick="closeModal();go('gmail')">Åbn Gmail-import</button></div><div class="settingrow"><strong>Månedligt budget</strong><form onsubmit="event.preventDefault();db.budget=Number(this.budget.value);persist();closeModal();render();toast('Budget gemt')"><label>Budget i DKK<input name="budget" type="number" min="1" max="1000000" required value="${db.budget}"></label><button class="primary">Gem budget</button></form></div><div class="settingrow"><strong>Dine data</strong><p class="help">${me?'Oplysningerne gemmes i din Subly-konto.':'Oplysningerne ligger i denne browser, indtil du logger ind. Eksportér en sikkerhedskopi, før du rydder browserdata.'}</p><button class="secondary" onclick="exportData()">↓ Eksportér data</button> <label class="secondary" style="display:inline-block;margin:0;cursor:pointer">↑ Importér data<input type="file" accept="application/json,.json" onchange="importData(this)" style="display:none"></label></div><div class="settingrow"><strong>Inaktive abonnementer</strong>${db.subs.filter(s=>!s.active).map(s=>`<button class="secondary" onclick="closeModal();edit('${s.id}')">${esc(s.name)}</button>`).join(' ')||'<p class="help">Ingen inaktive abonnementer.</p>'}</div><div class="settingrow"><strong>Start med din egen oversigt</strong><p class="help">Fjern alle data og tilføj dine egne abonnementer.</p><button class="danger" onclick="resetAsk()">Ryd oversigten</button></div><p class="help"><a class="textlink" href="/privatliv.html" target="_blank" rel="noopener">Privatlivspolitik</a></p>`)}
function resetAsk(){$('#modalcontent').innerHTML=head('Ryd din oversigt?')+'<p class="help">Alle abonnementer i denne browser fjernes. Eksportér dem først, hvis du vil gemme en kopi.</p><div class="formactions"><button class="secondary" onclick="settingsBack()">Tilbage</button><button class="primary" onclick="db.subs=[];db.demo=false;persist();closeModal();render();toast(\'Din oversigt er klar\')">Ryd alle abonnementer</button></div>'}
function settingsBack(){closeModal();settings()}
function download(text,name,type){let url=URL.createObjectURL(new Blob([text],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download(JSON.stringify(db,null,2),'subly-data.json','application/json');toast('Sikkerhedskopi hentet')}
async function importData(input){try{let data=JSON.parse(await input.files[0].text());if(!Array.isArray(data.subs)||data.subs.length>1000)throw Error();let normalized=data.subs.map(s=>{if(typeof s.name!=='string'||!s.name.trim()||typeof s.price!=='number'||!Number.isFinite(s.price)||s.price<0||s.price>1000000||!/^\d{4}-\d{2}-\d{2}$/.test(s.next)||Number.isNaN(date(s.next).getTime())||iso(date(s.next))!==s.next||!['monthly','quarterly','yearly'].includes(s.cycle))throw Error();return {...s,id:uid(),name:s.name.slice(0,60),plan:String(s.plan||'').slice(0,60),color:/^#[0-9a-f]{6}$/i.test(s.color)?s.color:'#586be8',fg:/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s.fg)?s.fg:'#ffffff',logo:String(s.logo||s.name[0]).slice(0,10),category:categories.includes(s.category)?s.category:'Andet',remind:[0,1,3,7].includes(s.remind)?s.remind:3,active:s.active!==false,unused:!!s.unused}});let sig=s=>[s.name.toLowerCase(),s.price,s.next,s.cycle].join('|');if(db.demo){db.subs=[]}let have=new Set(db.subs.map(sig));let fresh=normalized.filter(s=>!have.has(sig(s)));db.subs.push(...fresh);if(Number.isFinite(data.budget)&&data.budget>0&&data.budget<=1000000)db.budget=data.budget;db.demo=false;persist();closeModal();render();toast(fresh.length+' abonnementer importeret'+(normalized.length-fresh.length?', '+(normalized.length-fresh.length)+' fandtes allerede':''))}catch{toast('Filen er ikke en gyldig Subly-sikkerhedskopi')}}
function showReminders(){let subs=ordered().filter(s=>days(s)<=s.remind);modal(head('Dine påmindelser')+`<p class="help">Vises fra det antal dage før betalingen, du har valgt.</p>${subs.map(s=>`<div class="payrow">${logo(s,true)}<span><strong>${esc(s.name)}</strong><small>${days(s)===0?'Betales i dag':'Betales om '+days(s)+(days(s)===1?' dag':' dage')}</small></span><span class="amount">${money(s.price)}</span></div>`).join('')||'<div class="empty">Ingen påmindelser lige nu.<p>Du har styr på de næste betalinger.</p></div>'}<p class="help">Hent din kalender under Kalender for at oprette varsler uden for appen.</p>`)}
function exportCalendar(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Subly//DA','CALSCALE:GREGORIAN'];let safe=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');for(let s of active()){let start=nextDate(s);for(let n=0;n<12;n++){let d=new Date(start.getFullYear(),start.getMonth()+n*(s.cycle==='yearly'?12:s.cycle==='quarterly'?3:1),1);d.setDate(Math.min(date(s.next).getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));if(d>new Date(now.getFullYear()+1,now.getMonth(),now.getDate()))break;lines.push('BEGIN:VEVENT',`UID:${s.id}-${iso(d)}@subly`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;VALUE=DATE:${iso(d).replace(/-/g,'')}`,`SUMMARY:${safe(s.name+' · '+money(s.price))}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${safe(s.name+' fornyes snart')}`,`TRIGGER:-P${s.remind}D`,'END:VALARM','END:VEVENT')}}lines.push('END:VCALENDAR');download(lines.join('\r\n'),'subly-kalender.ics','text/calendar');toast('Kalender hentet. Importér den i din kalenderapp.')}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
